name: Bootstrap ECS Environment

on:
  workflow_dispatch:
    inputs:
      aws_region:
        description: "AWS region"
        required: true
        default: "ap-south-1"
      cluster_name:
        description: "ECS cluster name"
        required: true
        default: "langchain-agent-cluster"
      service_name:
        description: "ECS service name"
        required: true
        default: "langchain-agent-service"
      subnet_ids:
        description: "Comma-separated subnet IDs for awsvpc mode"
        required: true
      security_group_ids:
        description: "Comma-separated security group IDs"
        required: true
      desired_count:
        description: "Desired task count"
        required: true
        default: "1"
      assign_public_ip:
        description: "Assign public IP"
        required: true
        default: "ENABLED"
      llm_provider:
        description: "Default LLM provider passed to the container"
        required: true
        default: "openai"

env:
  ECR_REPOSITORY: langchain-agent
  TASK_FAMILY: langchain-agent
  CONTAINER_NAME: langchain-agent
  LOG_GROUP_NAME: /ecs/langchain-agent

jobs:
  bootstrap:
    name: Create ECS Cluster and Service
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}

      - name: Validate required secrets
        run: |
          test -n "${{ secrets.ECS_TASK_EXECUTION_ROLE_ARN }}" || (echo "Missing secret: ECS_TASK_EXECUTION_ROLE_ARN" && exit 1)
          test -n "${{ secrets.ECS_TASK_ROLE_ARN }}" || (echo "Missing secret: ECS_TASK_ROLE_ARN" && exit 1)
          test -n "${{ secrets.OPENAI_SECRET_ARN }}" || (echo "Missing secret: OPENAI_SECRET_ARN" && exit 1)
          test -n "${{ secrets.PERPLEXITY_SECRET_ARN }}" || (echo "Missing secret: PERPLEXITY_SECRET_ARN" && exit 1)

      - name: Resolve account and image URI
        id: account
        env:
          AWS_REGION: ${{ inputs.aws_region }}
        run: |
          ACCOUNT_ID="$(aws sts get-caller-identity --query 'Account' --output text)"
          IMAGE_URI="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:latest"
          echo "account_id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Ensure ECR repository exists
        env:
          AWS_REGION: ${{ inputs.aws_region }}
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" --region "$AWS_REGION" >/dev/null 2>&1 || \
          aws ecr create-repository --repository-name "$ECR_REPOSITORY" --region "$AWS_REGION"

      - name: Ensure CloudWatch log group exists
        env:
          AWS_REGION: ${{ inputs.aws_region }}
        run: |
          aws logs create-log-group --log-group-name "$LOG_GROUP_NAME" --region "$AWS_REGION" || true

      - name: Create ECS cluster if missing
        env:
          AWS_REGION: ${{ inputs.aws_region }}
          ECS_CLUSTER: ${{ inputs.cluster_name }}
        run: |
          CLUSTER_STATUS="$(aws ecs describe-clusters \
            --clusters "$ECS_CLUSTER" \
            --region "$AWS_REGION" \
            --query 'clusters[0].status' \
            --output text 2>/dev/null || true)"
          if [ -z "$CLUSTER_STATUS" ] || [ "$CLUSTER_STATUS" = "None" ] || [ "$CLUSTER_STATUS" = "INACTIVE" ]; then
            aws ecs create-cluster --cluster-name "$ECS_CLUSTER" --region "$AWS_REGION"
          else
            echo "Cluster '$ECS_CLUSTER' already exists with status '$CLUSTER_STATUS'."
          fi

      - name: Render ECS task definition
        env:
          AWS_REGION: ${{ inputs.aws_region }}
          IMAGE_URI: ${{ steps.account.outputs.image_uri }}
          ECS_TASK_EXECUTION_ROLE_ARN: ${{ secrets.ECS_TASK_EXECUTION_ROLE_ARN }}
          ECS_TASK_ROLE_ARN: ${{ secrets.ECS_TASK_ROLE_ARN }}
          OPENAI_SECRET_ARN: ${{ secrets.OPENAI_SECRET_ARN }}
          PERPLEXITY_SECRET_ARN: ${{ secrets.PERPLEXITY_SECRET_ARN }}
          LLM_PROVIDER: ${{ inputs.llm_provider }}
        run: |
          jq \
            --arg image "$IMAGE_URI" \
            --arg region "$AWS_REGION" \
            --arg executionRoleArn "$ECS_TASK_EXECUTION_ROLE_ARN" \
            --arg taskRoleArn "$ECS_TASK_ROLE_ARN" \
            --arg openaiSecretArn "$OPENAI_SECRET_ARN" \
            --arg perplexitySecretArn "$PERPLEXITY_SECRET_ARN" \
            --arg llmProvider "$LLM_PROVIDER" \
            '
            .family = "langchain-agent" |
            .containerDefinitions[0].name = "langchain-agent" |
            .containerDefinitions[0].image = $image |
            .containerDefinitions[0].logConfiguration.options["awslogs-region"] = $region |
            .containerDefinitions[0].environment = [{"name":"LLM_PROVIDER","value":$llmProvider}] |
            .containerDefinitions[0].secrets = [
              {"name":"OPENAI_API_KEY","valueFrom":$openaiSecretArn},
              {"name":"PERPLEXITY_API_KEY","valueFrom":$perplexitySecretArn}
            ] |
            .executionRoleArn = $executionRoleArn |
            .taskRoleArn = $taskRoleArn
            ' deployment/ecs-task-definition.json > ecs-task-definition.bootstrap.json

      - name: Register ECS task definition
        id: taskdef
        env:
          AWS_REGION: ${{ inputs.aws_region }}
        run: |
          TASK_DEF_ARN="$(aws ecs register-task-definition \
            --cli-input-json file://ecs-task-definition.bootstrap.json \
            --region "$AWS_REGION" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)"
          echo "task_definition_arn=$TASK_DEF_ARN" >> "$GITHUB_OUTPUT"

      - name: Create or update ECS service
        env:
          AWS_REGION: ${{ inputs.aws_region }}
          ECS_CLUSTER: ${{ inputs.cluster_name }}
          ECS_SERVICE: ${{ inputs.service_name }}
          TASK_DEF_ARN: ${{ steps.taskdef.outputs.task_definition_arn }}
          DESIRED_COUNT: ${{ inputs.desired_count }}
          ASSIGN_PUBLIC_IP: ${{ inputs.assign_public_ip }}
          SUBNET_IDS: ${{ inputs.subnet_ids }}
          SECURITY_GROUP_IDS: ${{ inputs.security_group_ids }}
        run: |
          SUBNET_JSON="$(printf '%s' "$SUBNET_IDS" | jq -R 'split(",") | map(gsub("^\\s+|\\s+$"; ""))')"
          SG_JSON="$(printf '%s' "$SECURITY_GROUP_IDS" | jq -R 'split(",") | map(gsub("^\\s+|\\s+$"; ""))')"
          NETWORK_JSON="$(jq -cn \
            --argjson subnets "$SUBNET_JSON" \
            --argjson sgs "$SG_JSON" \
            --arg assignPublicIp "$ASSIGN_PUBLIC_IP" \
            '{awsvpcConfiguration:{subnets:$subnets,securityGroups:$sgs,assignPublicIp:$assignPublicIp}}')"

          SERVICE_STATUS="$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION" \
            --query 'services[0].status' \
            --output text 2>/dev/null || true)"

          if [ -z "$SERVICE_STATUS" ] || [ "$SERVICE_STATUS" = "None" ] || [ "$SERVICE_STATUS" = "INACTIVE" ]; then
            aws ecs create-service \
              --cluster "$ECS_CLUSTER" \
              --service-name "$ECS_SERVICE" \
              --task-definition "$TASK_DEF_ARN" \
              --desired-count "$DESIRED_COUNT" \
              --launch-type FARGATE \
              --network-configuration "$NETWORK_JSON" \
              --region "$AWS_REGION"
          else
            aws ecs update-service \
              --cluster "$ECS_CLUSTER" \
              --service "$ECS_SERVICE" \
              --task-definition "$TASK_DEF_ARN" \
              --desired-count "$DESIRED_COUNT" \
              --region "$AWS_REGION"
          fi

      - name: Wait for ECS service stability
        env:
          AWS_REGION: ${{ inputs.aws_region }}
          ECS_CLUSTER: ${{ inputs.cluster_name }}
          ECS_SERVICE: ${{ inputs.service_name }}
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION"

      - name: Print bootstrap summary
        run: |
          echo "Cluster: ${{ inputs.cluster_name }}"
          echo "Service: ${{ inputs.service_name }}"
          echo "Region: ${{ inputs.aws_region }}"
          echo "Image: ${{ steps.account.outputs.image_uri }}"
